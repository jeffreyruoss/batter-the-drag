<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batter The Drag</title>
  <link rel="preload" href="batter-the-drag.svg" as="image">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* disable horz and vert window scrolling */
    body {
      overflow: hidden;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    /* Keeps body's background on body, so the fade-to-black below fades it too */
    html {
      background: black;
    }

    body {
      background-color: black;
      background-image: url('bg-2.webp');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 50px;
    }

    .logo {
      width: 100%;
      max-width: 1100px;
      height: 0;
      padding-bottom: 37%;
      position: relative;
      /* overflow: hidden; */
    }

    @media (min-width: 1200px) {
      .logo {
        padding-bottom: 24%;
      }
    }

    .mask-container {
      mask: url('batter-the-drag.svg') no-repeat center;
      -webkit-mask: url('batter-the-drag.svg') no-repeat center;
      mask-size: contain;
      -webkit-mask-size: contain;
      width: 90%;
      max-width: 1200px;
      height: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .mask-container img.universe {
      width: 100%;
      height: 100%;
      animation: fadeIn 3s ease-in-out, rotateAndScale 100s infinite linear;
    }
    @media (min-width: 1024px) {
      .mask-container img.universe {
        animation: fadeIn 3s ease-in-out, rotateAndScale 200s infinite linear;
      }
    }

    /* Bottom-left: the EP, its songs, Bandcamp, socials */
    .info {
      position: fixed;
      left: clamp(20px, 5vw, 80px);
      bottom: clamp(20px, 5vw, 80px);
      z-index: 1;
      display: grid;
      gap: 20px;
      max-width: min(460px, calc(100vw - 40px));
      font-family: 'Arial', sans-serif;
      animation: fadeIn 3s ease-in-out;
    }

    .eyebrow {
      color: #808492;
      font-size: 13px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .tracks {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: #c9d3e3;
      font-size: 15px;
    }

    .tracks button {
      all: unset;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tracks button:hover,
    .tracks button[aria-current="true"] {
      color: #6693C8;
    }

    .tracks button:focus-visible {
      outline: 1px solid #6693C8;
      outline-offset: 4px;
    }

    .tracks span {
      margin-right: 5px;
      color: #808492;
      font-size: 11px;
    }

    .listen {
      justify-self: start;
      padding: 12px 22px;
      border: 1px solid #6693C8;
      border-radius: 30px;
      color: #6693C8;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s;
    }

    .listen:hover {
      background: #6693C8;
      color: #0b0d14;
    }

    .social-media {
      display: flex;
    }

    .social-media a {
      margin-right: 14px;
      transition: transform 0.2s;
    }

    .social-media a:hover {
      transform: scale(1.1);
    }

    .social-media svg {
      width: 34px;
      height: 34px;
      fill: #6693C8;
      transition: fill 0.2s;
    }

    .social-media a:hover svg {
      fill: #347ed3;
    }

     @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes rotateAndScale {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.6);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes slideUp {
      0% {
        transform: translateY(240px);
        opacity: 0;
      }
      80% {
        transform: translateY(240px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.5;
      }
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      /* top: 50%; */
      /* left: 50%; */
      z-index: -1;
      /* transform: translate(-50%, -50%); */
      /* max-width: 85vw; */
      /* max-height: 85vw; */
    }
    /* Big arrow back to the new album (home page) */
    .arrow {
      position: fixed;
      top: 50%;
      left: clamp(8px, 3vw, 56px);
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 16px;
      transform: translateY(-50%);
      color: #6693C8;
      text-decoration: none;
      font-family: 'Arial', sans-serif;
      animation: fadeIn 3s ease-in-out;
      transition: color 0.3s;
    }

    .arrow svg {
      width: clamp(38px, 5vw, 70px);
      height: clamp(76px, 10vw, 140px);
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      overflow: visible;
      transition: transform 0.3s;
    }

    .arrow .label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .arrow:hover {
      color: #fff;
    }

    .arrow:hover svg {
      transform: translateX(-8px);
    }

    /* Player: Human Adjacent */
    .player {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 260px;
      padding: 8px 16px 8px 8px;
      border-radius: 32px;
      background: rgba(10, 12, 20, 0.6);
      border: 1px solid rgba(102, 147, 200, 0.35);
      font-family: 'Arial', sans-serif;
      animation: fadeIn 3s ease-in-out;
    }

    .player-toggle {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #6693C8;
      color: #0b0d14;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .player-toggle:hover {
      background: #fff;
      transform: scale(1.06);
    }

    .player-toggle svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .player-toggle .i-pause,
    .player.is-playing .player-toggle .i-play {
      display: none;
    }

    .player.is-playing .player-toggle .i-pause {
      display: block;
    }

    .player-meta {
      flex: 1;
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .player-title {
      color: #c9d3e3;
      font-size: 14px;
    }

    .player-progress {
      height: 2px;
      border-radius: 2px;
      background: rgba(102, 147, 200, 0.25);
      overflow: hidden;
    }

    .player-progress span {
      display: block;
      height: 100%;
      background: #6693C8;
      transform-origin: left;
      transform: scaleX(var(--progress, 0));
    }

    /* Short screens: lift the logo so it clears the songs in the bottom-left */
    @media (min-width: 700px) and (max-height: 800px) {
      body {
        justify-content: flex-start;
        padding-top: 5vh;
      }

      .logo {
        max-width: min(1100px, 100vh);
      }

      .arrow .label {
        display: none;
      }
    }

    @media (max-width: 699px) {
      body {
        justify-content: flex-start;
        padding-top: max(110px, 14vh);
      }

      .player {
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: auto;
      }

      .info {
        left: 16px;
        bottom: calc(84px + env(safe-area-inset-bottom));
        gap: 16px;
      }

      .tracks {
        font-size: 14px;
      }

      .social-media svg {
        width: 30px;
        height: 30px;
      }

      .arrow {
        top: calc(8px + env(safe-area-inset-top));
        left: 4px;
        transform: none;
      }

      .arrow svg {
        width: 34px;
        height: 68px;
      }

      .arrow .label {
        display: none;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Arriving from the new album: fade out of its tunnel light */
    .arrive-light {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: #efebcb;
      opacity: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .arriving .arrive-light {
        animation: fadeOut 1.6s ease-in-out both;
      }
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    /* Leaving for the new album: fade to black */
    @media (prefers-reduced-motion: no-preference) {
      body {
        transition: opacity 0.6s ease-in;
      }
    }

    body.is-leaving {
      opacity: 0;
    }
  </style>
</head>

  <script>
    (function () {
      function store(key, value) { try { sessionStorage.setItem(key, value); } catch (e) {} }
      function recall(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }

      // ---------- Sound: the EP, starting on Human Adjacent ----------
      var TRACKS = [
        { title: 'Brutal Future', src: 'audio/brutal-future.mp3' },
        { title: 'Ghost Parasite', src: 'audio/ghost-parasite.mp3' },
        { title: 'Frozen Shoulder', src: 'audio/frozen-shoulder.mp3' },
        { title: 'Human Adjacent', src: 'audio/human-adjacent.mp3' },
        { title: 'Outsourced Thought', src: 'audio/outsourced-thought.mp3' }
      ];
      var audio = new Audio();
      audio.preload = 'none';
      var player = document.querySelector('.player');
      var toggle = player.querySelector('.player-toggle');
      var playerTitle = player.querySelector('.player-title');
      var trackButtons = document.querySelectorAll('[data-track]');
      var trackIndex = 3;
      var wantPlaying = false;
      var fadeTimer;

      // Volume ramp. iOS ignores audio.volume, so there it simply starts and stops.
      function fadeTo(volume, ms, done) {
        clearInterval(fadeTimer);
        var from = audio.volume;
        var start = performance.now();
        fadeTimer = setInterval(function () {
          var k = Math.min(1, (performance.now() - start) / ms);
          audio.volume = from + (volume - from) * k;
          if (k === 1) {
            clearInterval(fadeTimer);
            if (done) done();
          }
        }, 30);
      }

      function setPlaying(on) {
        wantPlaying = on;
        player.classList.toggle('is-playing', on);
        toggle.setAttribute('aria-label', on ? 'Pause' : 'Play');
      }

      function loadTrack(i) {
        trackIndex = i;
        audio.src = TRACKS[i].src;
        playerTitle.textContent = TRACKS[i].title;
        player.style.setProperty('--progress', 0);
        trackButtons.forEach(function (b) {
          b.setAttribute('aria-current', String(Number(b.dataset.track) === i));
        });
      }

      function play(fadeMs) {
        if (!audio.src) loadTrack(trackIndex);
        setPlaying(true);
        audio.volume = 0;
        // Blocked autoplay (e.g. Safari after a page change) leaves the player paused; one tap starts it.
        audio.play().then(function () { fadeTo(1, fadeMs); }, function (err) {
          if (err.name === 'NotAllowedError') setPlaying(false);
        });
      }

      function pause() {
        setPlaying(false);
        fadeTo(0, 400, function () { audio.pause(); });
      }

      toggle.addEventListener('click', function () {
        if (wantPlaying) {
          pause();
          store('btd-sound', 'off');
        } else {
          play(600);
          store('btd-sound', 'on');
        }
      });

      trackButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          loadTrack(Number(b.dataset.track));
          play(300);
          store('btd-sound', 'on');
        });
      });

      audio.addEventListener('ended', function () {
        loadTrack((trackIndex + 1) % TRACKS.length);
        play(10);
      });

      audio.addEventListener('timeupdate', function () {
        if (audio.duration) player.style.setProperty('--progress', audio.currentTime / audio.duration);
      });

      // Media keys / OS controls can pause us behind our back; keep the button honest.
      audio.addEventListener('pause', function () {
        if (wantPlaying && audio.paused && !audio.ended) setPlaying(false);
      });

      loadTrack(trackIndex);

      // Music was on over on the Wendt page: fade Human Adjacent in as the light fades out.
      if (recall('btd-sound') === 'on') play(3000);

      // ---------- Back to the new album ----------
      var prev = document.querySelector('[data-prev]');
      var leaving = false;

      function goPrev() {
        if (leaving) return;
        leaving = true;
        store('btd-sound', wantPlaying ? 'on' : 'off');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = prev.href; return; }
        if (wantPlaying) fadeTo(0, 550);
        document.body.classList.add('is-leaving');
        setTimeout(function () { location.href = prev.href; }, 600);
      }

      prev.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        goPrev();
      });

      window.addEventListener('keydown', function (e) {
        if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey || e.defaultPrevented) return;
        if (e.key === 'ArrowLeft') goPrev();
      });

      var touchX = null;
      // Single-finger swipes only, so pinch-zoom never navigates.
      window.addEventListener('touchstart', function (e) {
        touchX = e.touches.length === 1 ? e.touches[0].clientX : null;
      }, { passive: true });
      window.addEventListener('touchend', function (e) {
        if (touchX === null || e.touches.length > 0) { touchX = null; return; }
        if (e.changedTouches[0].clientX - touchX > 70) goPrev();
        touchX = null;
      });

      // Back button restores this page faded out; bring it back.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) {
          leaving = false;
          document.body.classList.remove('is-leaving');
          if (recall('btd-sound') === 'on') play(2000);
          else setPlaying(false);
        }
      });
    })();
  </script>
  <script>
    const mobileConfig = {
        sizeRange: [0.8, 2.3],
        speedRange: [0.1, 0.4],
        opacityRange: [0.1, 0.4],
        particleCount: 100
    };

    const desktopConfig = {
        sizeRange: [1, 3],
        speedRange: [0.2, 0.6],
        opacityRange: [0.1, 0.4],
        particleCount: 200
    };

    function onMount(callback) {
        document.addEventListener('DOMContentLoaded', callback);
    }

    onMount(function () {
        const isMobile = window.innerWidth <= 768;
        const particleConfig = isMobile ? mobileConfig : desktopConfig;

        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        function Particle(x, y, size, speed, directionAngle, finalOpacity) {
            this.x = x;
            this.y = y;
            this.size = size;
            this.speed = speed;
            this.directionX = Math.cos(directionAngle) * speed;
            this.directionY = Math.sin(directionAngle) * speed;
            this.finalOpacity = finalOpacity;
            this.opacity = 0;

            this.update = function () {
                this.x += this.directionX;
                this.y += this.directionY;
                this.fadeIn();
            };

            this.fadeIn = function () {
                if (this.opacity < this.finalOpacity) {
                    this.opacity += 0.005;
                }
            };

            this.draw = function () {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            };
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < particleConfig.particleCount; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let size = Math.random() * (particleConfig.sizeRange[1] - particleConfig.sizeRange[0]) + particleConfig.sizeRange[0];
                let speed = Math.random() * (particleConfig.speedRange[1] - particleConfig.speedRange[0]) + particleConfig.speedRange[0];
                let directionAngle = Math.floor(Math.random() * 360);
                let opacity = Math.random() * (particleConfig.opacityRange[1] - particleConfig.opacityRange[0]) + particleConfig.opacityRange[0];
                particlesArray.push(new Particle(x, y, size, speed, directionAngle, opacity));
            }
        }

        init();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Get the query parameters from the current URL
        const params = new URLSearchParams(window.location.search);

        // If the 'p' parameter is '1', run the animate function
        if (params.get('p') === '1') {
            animate();
        }
    });
  </script>
</body>
</html>
